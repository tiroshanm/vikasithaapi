name: Sync Facebook albums & deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"   # daily, 06:00 Sri Lanka time
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Photos are kept in the Actions cache between runs (not in git),
      # so each run only downloads new photos.
      - name: Restore gallery cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            resource/gallery
          key: gallery-${{ github.run_id }}
          restore-keys: gallery-

      - name: Sync albums from Facebook
        id: sync
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
        run: |
          if [ -z "$FB_PAGE_TOKEN" ]; then
            echo "::warning::FB_PAGE_TOKEN secret is not set — deploying without syncing the gallery."
            exit 0
          fi
          python3 scripts/sync_facebook.py --prune

      - name: Warn if sync failed
        if: steps.sync.outcome == 'failure'
        run: echo "::warning::Facebook sync failed (token expired?). Deploying the last synced gallery."

      - name: Save gallery cache
        if: steps.sync.outcome == 'success' && hashFiles('data/gallery.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            data
            resource/gallery
          key: gallery-${{ github.run_id }}

      - name: Build site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/
          mkdir -p _site/resource
          cp resource/default.mp4 resource/logo.jpeg _site/resource/
          [ -d resource/gallery ] && cp -R resource/gallery _site/resource/ || true
          mkdir -p _site/data
          if [ -f data/gallery.js ]; then
            cp -R data/gallery.js data/albums _site/data/
          else
            echo 'window.FB_GALLERY = {"albums": []};' > _site/data/gallery.js
          fi
          touch _site/.nojekyll
          echo "Site size: $(du -sh _site | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
